            - generic [ref=e59]:
              - 'heading "Codais ist jetzt Open Source: Warum ich meine Codex Companion App geöffnet habe" [level=1] [ref=e60]'
              - paragraph [ref=e61]: Warum ich Codais öffentlich gemacht habe, was mich seit April an Codex so begeistert und wohin sich mein Apple-first Codex Companion entwickeln könnte.
              - generic [ref=e62]:
                - generic [ref=e63]:
                  - text: Veröffentlicht
                  - time [ref=e64]: 17/05/2026
                - generic [ref=e65]:
                  - link "Codais App Icon in einem Apple-first Codex Workflow Artikelbild" [ref=e66] [cursor=pointer]:
                    - /url: /assets/img/posts/2026-05-17-codais-open-source/codais-open-source-cover.svg
                    - img "Codais App Icon in einem Apple-first Codex Workflow Artikelbild" [ref=e67]
                  - generic [ref=e68]: Codais App Icon in einem Apple-first Codex Workflow Artikelbild
                - generic [ref=e69]:
                  - generic [ref=e70]:
                    - text: Von
                    - emphasis [ref=e71]:
                      - link "252425 Homelab" [ref=e72] [cursor=pointer]:
                        - /url: https://github.com/Anes-03
                  - generic [ref=e74]:
                    - emphasis [ref=e75]: 6 Min.
                    - text: lesen
            - text:  
            - generic [ref=e76]:
              - paragraph [ref=e77]:
                - text: Seit April nutze ich Codex immer mehr. Nicht nur für kleine Experimente, sondern für sehr viele Projekte gleichzeitig. Eines davon ist
                - link "Codais" [ref=e78] [cursor=pointer]:
                  - /url: https://github.com/Anes-03/Codais
                - text: ", und genau dieses Projekt habe ich jetzt öffentlich gemacht."
              - paragraph [ref=e79]: "Codais ist aus einem ziemlich einfachen Wunsch entstanden: Ich wollte mein Codex-Setup auch unterwegs nutzen können. Nicht als getrennte Cloud-Umgebung, sondern so, dass mein Mac weiterhin die eigentliche Arbeitsmaschine bleibt. Also dort, wo die Dateien liegen, wo die Shell läuft und wo Codex wirklich Zugriff auf meine lokalen Projekte hat."
              - heading "Warum überhaupt Codais?" [level=2] [ref=e80]
              - paragraph [ref=e81]: Codex kann inzwischen sehr viel. Besonders seit dem Update im April fühlt es sich für mich so an, als wäre das Tool noch einmal deutlich mächtiger geworden. Ich nutze es für Blog-Arbeit, App-Ideen, kleine Automationen, Debugging, UI-Experimente und alles Mögliche dazwischen.
              - paragraph [ref=e82]: Gleichzeitig habe ich OpenClaw seit April immer weniger genutzt. Einerseits war das Codex-Limit dort schnell erreicht, andererseits haben sich einige Workflows für mich nicht mehr so gut angefühlt, seit Anthropic die Nutzung der Claude-Code-Sub darüber nicht mehr erlaubt. Dazu kam, dass mein eigenes OpenClaw-Setup irgendwie immer fragiler wurde. Es brauchte viel Pflege, viel Setup und man musste ständig aufpassen, dass alles sauber bleibt.
              - paragraph [ref=e83]: "Was für mich noch stärker ins Gewicht fällt: Codex deckt inzwischen grundsätzlich fast alles ab, was ich mir wünsche. Das ist bei mir meistens Arbeit direkt in Projekten, aber mittlerweile nutze ich es auch immer öfter für private Dinge. Dadurch verwende ich sogar ChatGPT selbst weniger, weil ich viele Gedanken, Aufgaben und kleine Experimente direkt in meinem lokalen Codex-Workflow erledige."
              - paragraph [ref=e84]: "Hermes Agent gewinnt gerade an Popularität, und ich möchte mir das sicher noch genauer anschauen. Aber ganz ehrlich: Wenn Codex fast alles abdeckt, was ich mir im Alltag wünsche, dann brauche ich nicht zwingend noch ein weiteres großes Agenten-Setup daneben."
              - heading "Was mir bei Codex-Automationen noch fehlt" [level=2] [ref=e85]
              - paragraph [ref=e86]: Mir ist bewusst, dass es in Codex bereits Automatisierungen gibt. Ich habe damit auch schon herumgespielt, und für viele geplante Aufgaben ist das nützlich. Man kann Tasks zu einer festen Zeit starten lassen, was für Blog-Arbeit, Homelab-Checks oder wiederkehrende Codepflege durchaus spannend ist.
              - paragraph [ref=e87]: "Was mir im Vergleich zu OpenClaw oder Hermes Agent noch fehlt, ist aber eine andere Art von Automatisierung: ein Agent, der bei einem laufenden Task immer wieder reinschaut und dabei den früheren Kontext behalten kann."
              - paragraph [ref=e88]: Genau das finde ich an diesen Tools interessant. Wenn man übertrieben gesagt ein KI-Modell trainiert, einen langen Build laufen lässt oder einen größeren Prozess überwacht, dann möchte man nicht unbedingt jedes Mal eine neue Session starten. Man möchte eher, dass der Agent wiederkommt, den Stand prüft, die vorherige Einschätzung noch kennt und dann sinnvoll weiterarbeitet.
              - paragraph [ref=e89]: Bei Codex fühlt es sich aktuell eher so an, als würde bei einer Automation eine neue Session gestartet. Das kann für viele Aufgaben völlig okay sein, aber es ist nicht dasselbe wie ein Agent, der über längere Zeit an einem Prozess dranbleibt.
              - paragraph [ref=e90]: Wenn Codex so eine Art wiederkehrendes Reinschauen mit erhaltenem Kontext direkt unterstützen würde, dann bräuchte ich wahrscheinlich wirklich kein OpenClaw oder Hermes Agent mehr. Dann wäre Codex für meinen Workflow fast komplett.
              - paragraph [ref=e91]: Über mein OpenClaw-Erlebnis möchte ich später noch einen eigenen Artikel schreiben. Da gibt es genug Punkte, die man sauber auseinandernehmen kann.
              - heading "Dann kam die ChatGPT-App" [level=2] [ref=e92]
              - paragraph [ref=e93]: Der Grund, warum ich Codais jetzt öffentlich gemacht habe, hängt auch mit OpenAI selbst zusammen. Der Codex-Tab in der ChatGPT-App wurde erweitert. Früher war dieser Tab eher mit Codex Web verknüpft. Das war schon praktisch, weil man vom iPhone aus an einem Projekt arbeiten konnte. Für mich war es aber nie die ideale Lösung, weil beim lokalen Testen und späteren Zusammenführen schnell Merge-Konflikte entstehen konnten.
              - paragraph [ref=e94]: "Mit der neuen ChatGPT-Version und der aktuellen Codex-Version fühlt sich das anders an. Man kann eine Codex-Instanz auf dem eigenen Rechner steuern. Die Oberfläche im Chat wirkt vertraut: Modellauswahl, damit verbundene Optionen, Planmodus, Plugins und sogar Slash-Befehle sind da."
              - paragraph [ref=e95]: "Genau das war im Kern etwas, das ich mir schon lange gewünscht habe: Codex lokal auf dem Rechner, aber von unterwegs steuerbar."
              - paragraph [ref=e96]: "Und damit war für mich klar: Codais muss nicht länger privat bleiben. Es ist aktuell eher ein Konzept und Prototyp als eine fertige App, aber vielleicht ist genau das der richtige Zeitpunkt, es offen zu zeigen."
              - heading "Was Codais aktuell ist" [level=2] [ref=e97]
              - paragraph [ref=e98]: "Ich sehe Codais als unabhängigen Apple-first Prototyp für Codex-basierte Agenten-Workflows. Wichtig ist dabei: Codais ist kein offizielles OpenAI-Projekt und auch nicht mit OpenAI verbunden."
              - paragraph [ref=e99]: "Technisch ist es ein Monorepo aus drei Teilen:"
              - list [ref=e100]:
                - listitem [ref=e101]:
                  - code [ref=e102]: apple-client
                  - text: ": eine SwiftUI-App für iOS, iPadOS und visionOS"
                - listitem [ref=e103]:
                  - code [ref=e104]: mac-companion
                  - text: ": ein Rust/Axum-Dienst auf dem Mac, der lokale HTTP- und WebSocket-APIs rund um Codex-Sessions anbietet"
                - listitem [ref=e105]:
                  - code [ref=e106]: relay-service
                  - text: ": ein Node.js/TypeScript-Relay für Pairing, Token-Refresh, Widerruf und WebSocket-Weiterleitung"
              - paragraph [ref=e107]: "Die Idee dahinter gefällt mir weiterhin sehr: Das Apple-Gerät ist die Steueroberfläche, aber die Ausführung bleibt auf dem Mac. Der Mac ist also weiterhin die Trust Boundary. Dort liegen Workspace-Zugriff, Shell und Codex CLI. Das Relay soll nur beim Pairing und Routing helfen, aber keine Shell-Befehle oder Codex-Workloads ausführen."
              - paragraph [ref=e108]: Aktuell kann Codais unter anderem Apple-Geräte mit dem Mac Companion verbinden, Codex-Sessions starten, fortsetzen, abbrechen und streamen, Modell und Reasoning Effort auswählen, Session-Verlauf und Tool-Events anzeigen und Workspace-Dateien browsen oder als Vorschau öffnen.
              - paragraph [ref=e109]:
                - text: "Der Stack passt auch gut zu dem, was ich bauen wollte: Swift als Hauptsprache, dazu Rust für den Companion und TypeScript für das Relay. Ich habe Codais unter der MIT-Lizenz veröffentlicht. Der Code liegt jetzt öffentlich unter"
                - link "github.com/Anes-03/Codais" [ref=e110] [cursor=pointer]:
                  - /url: https://github.com/Anes-03/Codais
                - text: .
              - heading "Warum ich es trotzdem weiter spannend finde" [level=2] [ref=e111]
              - paragraph [ref=e112]: Auch wenn OpenAI inzwischen sehr viel von dem abdeckt, was ich mit Codais ursprünglich wollte, sehe ich das Projekt nicht als erledigt. Eher hat sich die Rolle verändert.
              - paragraph [ref=e113]: "Codais könnte mehr ein Experimentierfeld werden:"
              - list [ref=e114]:
                - listitem [ref=e115]: Wie sieht eine richtig gute mobile Codex-Steuerung aus?
                - listitem [ref=e116]: Wie kann man mehrere Provider unterstützen?
                - listitem [ref=e117]: Wie verbindet man lokale Workspaces sauber mit Remote-Steuerung?
                - listitem [ref=e118]: Wie weit kann man iPhone, iPad oder Vision Pro als Agenten-Control-Surface denken?
                - listitem [ref=e119]: Wie kann man Sessions, Dateien, Logs und Automationen übersichtlich zusammenbringen?
              - paragraph [ref=e120]:
                - text: Bei Provider-Unterstützung musste ich auch an
                - link "T3 Code" [ref=e121] [cursor=pointer]:
                  - /url: https://github.com/pingdotgg/t3code?tab=readme-ov-file
                - text: denken. Einige Elemente aus dieser Richtung könnten gut zu Codais passen. Auch Learnings aus meinem eigenen ähnlichen Projekt, dem
                - link "Code WebEditor" [ref=e122] [cursor=pointer]:
                  - /url: https://code-webeditor.252425.xyz
                - text: ", können in Codais einfließen. Gerade wenn es um Editor-UI, Provider-Konfiguration, lokale Einstellungen und einfache Workflows geht, habe ich dort schon einiges gelernt."
              - heading "Es ist eines von vielen Projekten" [level=2] [ref=e123]
              - paragraph [ref=e124]: Codais ist nur eines von vielen Projekten, an denen ich gerade arbeite. Genau das macht diese Phase für mich so spannend. Ich habe seit langer Zeit nicht mehr so viel Freude an Tech gehabt.
              - paragraph [ref=e125]: "Ich möchte in nächster Zeit noch über einige Themen schreiben, die daraus entstanden sind. Zum Beispiel:"
              - list [ref=e126]:
                - listitem [ref=e127]: wie man ein Android-Smartphone mit Codex nutzen kann
                - listitem [ref=e128]: wie man mit Codex Videos erstellen und bearbeiten kann
                - listitem [ref=e129]: was bei OpenClaw für mich gut und was weniger gut funktioniert hat
                - listitem [ref=e130]: welche Rolle mobile Agenten-Workflows in meinem Homelab spielen könnten
              - paragraph [ref=e131]: Für den Moment ist Codais öffentlich. Nicht als fertiges Produkt, sondern als offenes Konzept, an dem man sehen kann, wohin meine Gedanken bei Codex, lokalen Workflows und Apple-Geräten gerade gehen.
              - paragraph [ref=e132]:
                - text: "Code:"
                - link "Anes-03/Codais" [ref=e133] [cursor=pointer]:
                  - /url: https://github.com/Anes-03/Codais
