<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Codais ist Open Source</title>
  <desc id="desc">Artikelbild mit Codais App Icon, Terminal- und Apple-first Agenten-Workflow Anmutung.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.48" stop-color="#101827"/>
      <stop offset="1" stop-color="#18291f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182033" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0d121f" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52d273"/>
      <stop offset="0.52" stop-color="#5bb8ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#ffffff" stroke-width="1">
    <path d="M160 180H1440"/>
    <path d="M160 300H1440"/>
    <path d="M160 420H1440"/>
    <path d="M160 540H1440"/>
    <path d="M160 660H1440"/>
    <path d="M290 120V780"/>
    <path d="M520 120V780"/>
    <path d="M750 120V780"/>
    <path d="M980 120V780"/>
    <path d="M1210 120V780"/>
  </g>

  <circle cx="1215" cy="220" r="190" fill="#52d273" opacity="0.14" filter="url(#soft)"/>
  <circle cx="360" cy="720" r="230" fill="#5bb8ff" opacity="0.11" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <rect x="150" y="130" width="1300" height="640" rx="34" fill="url(#panel)" stroke="#2b3446"/>
    <rect x="150" y="130" width="1300" height="68" rx="34" fill="#111827"/>
    <circle cx="201" cy="165" r="10" fill="#ff5f57"/>
    <circle cx="236" cy="165" r="10" fill="#febc2e"/>
    <circle cx="271" cy="165" r="10" fill="#28c840"/>
    <rect x="330" y="150" width="310" height="30" rx="15" fill="#1f2937"/>
    <text x="358" y="171" fill="#9ca3af" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16">~/Projects/Codais</text>
  </g>

  <g opacity="0.88" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="30">
    <text x="220" y="280" fill="#52d273">$ codex</text>
    <text x="220" y="338" fill="#d1d5db">agent workflow: local mac</text>
    <text x="220" y="396" fill="#d1d5db">client: iPhone / iPad / visionOS</text>
    <text x="220" y="454" fill="#d1d5db">relay: pairing + routing</text>
    <text x="220" y="512" fill="#d1d5db">status: open source</text>
    <rect x="220" y="548" width="560" height="4" rx="2" fill="url(#line)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="965" y="260" width="315" height="315" rx="72" fill="#0b1020"/>
    <image href="codais-app-icon.png" x="985" y="280" width="275" height="275" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <text x="220" y="658" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, Segoe UI, sans-serif" font-size="70" font-weight="750">Codais ist Open Source</text>
  <text x="222" y="710" fill="#aeb8c7" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, Segoe UI, sans-serif" font-size="30">Apple-first Control Surface fuer Codex-Workflows</text>
</svg>
